name: Merge submission
run-name: merge PR to flathub/${{ inputs.appid }}@${{ inputs.target_branch }}

on:
  workflow_dispatch:
    inputs:
      fork_url:
        description: 'Clone URL of contributor fork'
        required: true
      expected_sha:
        description: '40-char commit SHA to push'
        required: true
      appid:
        description: 'Flatpak app ID (becomes flathub/<appid>)'
        required: true
      target_branch:
        description: 'Target branch on flathub/<appid> (master, beta, branch/*)'
        required: true
        default: 'master'
      flathubbot_token:
        description: 'flathubbot token (push to flathub/<appid>)'
        required: true
      callback_url:
        description: 'Vorarbeiter callback URL'
        required: true
      callback_token:
        description: 'Bearer token for callback auth'
        required: true

permissions: {}

concurrency:
  group: merge-${{ inputs.appid }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch commit from fork
        env:
          FORK_URL: ${{ inputs.fork_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git init -q repo
          cd repo
          git remote add origin "$FORK_URL"
          git fetch origin "$EXPECTED_SHA"
          fetched_sha=$(git rev-parse FETCH_HEAD)
          [ "$fetched_sha" = "$EXPECTED_SHA" ] || exit 1

      - name: Pull linter image
        if: inputs.target_branch == 'master' || inputs.target_branch == 'beta'
        run: |
          set -euo pipefail
          for delay in 0 15 30 60 120; do
            sleep "$delay"
            docker pull ghcr.io/flathub-infra/flatpak-builder-lint:unprivileged && exit 0
          done
          exit 1

      - name: Guard runtime extensions
        env:
          APPID: ${{ inputs.appid }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        working-directory: repo
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            master) ref_branch=stable ;;
            beta) ref_branch=beta ;;
            *) exit 0 ;;
          esac
          manifest=""
          for ext in json yaml yml; do
            if git cat-file -e "$EXPECTED_SHA:$APPID.$ext" 2>/dev/null; then
              manifest="$APPID.$ext"
              break
            fi
          done
          if [ -z "$manifest" ]; then
            echo "No manifest named $APPID.{json,yaml,yml} at $EXPECTED_SHA"
            exit 1
          fi
          git checkout --detach "$EXPECTED_SHA"
          git submodule update --init --recursive --depth 1
          if ! shown_manifest=$(
            docker run --rm \
              --volume "$PWD:/work" \
              --workdir /work \
              --entrypoint="" \
              ghcr.io/flathub-infra/flatpak-builder-lint:unprivileged \
              flatpak-builder --show-manifest "/work/$manifest"
          ); then
            echo "Failed to read $manifest at $EXPECTED_SHA"
            exit 1
          fi
          if jq -e --arg ref_branch "$ref_branch" '."build-extension" == true and .branch != null and (.branch | tostring) != $ref_branch' <<< "$shown_manifest" > /dev/null; then
            echo "Refusing to push runtime extension $APPID with branch $(jq -r '.branch' <<< "$shown_manifest") to $TARGET_BRANCH"
            exit 1
          fi

      - name: Push to flathub/${{ inputs.appid }}
        env:
          APPID: ${{ inputs.appid }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        working-directory: repo
        run: |
          set -euo pipefail
          FLATHUBBOT_TOKEN="$(jq -r '.inputs.flathubbot_token' $GITHUB_EVENT_PATH)"
          echo "::add-mask::$FLATHUBBOT_TOKEN"
          AUTH_B64="$(printf 'x-access-token:%s' "$FLATHUBBOT_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_B64"
          git -c http.extraheader="Authorization: Basic $AUTH_B64" \
              push "https://github.com/flathub/$APPID.git" \
              "FETCH_HEAD:refs/heads/$TARGET_BRANCH"

      - name: Report status to vorarbeiter
        if: always()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          CALLBACK_TOKEN="$(jq -r '.inputs.callback_token' $GITHUB_EVENT_PATH)"
          echo "::add-mask::$CALLBACK_TOKEN"
          status=failure
          [ "$JOB_STATUS" = "success" ] && status=success
          curl -fsS -X POST \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -d "{\"status\":\"$status\"}" \
            "$CALLBACK_URL"
