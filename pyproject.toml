[project]
name = "vorarbeiter"
version = "0.1.0"
description = "Build dispatcher for Flathub"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.18.5",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "psycopg-pool>=3.3.1",
    "fastapi>=0.140.0",
    "pydantic-settings>=2.14.2",
    "sentry-sdk>=2.66.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "granian>=2.7.9",
    "gql[requests]>=4.0.0,<5",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.3",
    "pygobject>=3.56.3",
    "httpx2>=2.9.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.16.0",
    "pytest-xdist>=3.8.0",
    "granian[reload]>=2.7.9",
    "ty==0.0.63",
]

[tool.mypy]
check_untyped_defs = true
show_error_codes = true
