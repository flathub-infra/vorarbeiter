[project]
name = "vorarbeiter"
version = "0.1.0"
description = "Build dispatcher for Flathub"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.19.1",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "psycopg-pool>=3.3.1",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sentry-sdk>=2.68.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "granian>=2.8.1",
    "gql[requests]>=4.0.0,<5",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.3",
    "pygobject>=3.56.3",
    "httpx2>=2.10.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.16.3",
    "pytest-xdist>=3.8.0",
    "granian[reload]>=2.8.1",
    "ty==0.0.71",
]

[tool.mypy]
check_untyped_defs = true
show_error_codes = true
